[tool.poetry]
name = "legacy-mcp-analyzer"
version = "2.1.0"
description = "MCP Server for analyzing C++ legacy codebases"
authors = ["Antigravity <antigravity@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# FastMCP 2.x (standalone framework) — bundles the official `mcp` SDK,
# latest MCP spec support (structured output, elicitation, auth, middleware).
fastmcp = ">=2.14,<3"
tree-sitter = "^0.23.0"
tree-sitter-cpp = "^0.23.0"
networkx = "^3.2.1"
uvicorn = "^0.41.0"
starlette = "^0.52.1"
huggingface-hub = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
mypy = "^1.8.0"
black = "^24.1.0"
ruff = "^0.15.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
# Strict typing is enforced on the library code (src/). Tests use pytest
# idioms that strict mode rejects; they are covered by pytest in CI instead.
files = ["src"]
strict = true
ignore_missing_imports = true
pretty = true

[tool.ruff]
line-length = 88
target-version = "py311"
